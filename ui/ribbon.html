<div id="panels"></div>
<script>
const icon=(id,extra='')=>`<svg class="${extra}"><use href="#${id}"/></svg>`;
const button=(cmd,id,label='',big=false,arg='')=>`<button class="${big?'big':label?'small':'icon'}" data-command="${cmd}" data-argument="${arg}" title="${label||cmd}">${icon(id)}${label?`<span>${label}</span>`:''}</button>`;
const group=(name,contents)=>`<section class="group"><div class="controls">${contents}</div><div class="caption">${name}</div></section>`;
const row=x=>`<div class="row">${x}</div>`,rows=x=>`<div class="rows">${x}</div>`;
const textbutton=(cmd,text,title)=>`<button class="icon texticon" data-command="${cmd}" title="${title}">${text}</button>`;
const home=group('Clipboard',button('Paste','paste','Paste',true)+rows(button('Cut','cut')+button('Copy','copy')+button('FormatPaintbrush','brush')))+group('Font',rows(row(`<select aria-label="Font" class="fontname" data-command="CharFontName"><option>Aptos</option><option>Arial</option><option>Calibri</option><option>Cambria</option><option>Times New Roman</option><option>Liberation Serif</option></select><select aria-label="Font size" class="fontsize" data-command="FontHeight">${[8,9,10,11,12,14,16,18,20,24,28,36,48,72].map(n=>`<option ${n===12?'selected':''}>${n}</option>`).join('')}</select>`)+row(textbutton('Bold','<b>B</b>','Bold (⌘B)')+textbutton('Italic','<i>I</i>','Italic (⌘I)')+textbutton('Underline','<u>U</u>','Underline (⌘U)')+textbutton('Strikeout','<s>ab</s>','Strikethrough')+textbutton('SubScript','x₂','Subscript')+textbutton('SuperScript','x²','Superscript')+textbutton('ResetAttributes','A<span style="color:#9535a6;font-size:12px">◇</span>','Clear formatting'))+row(textbutton('FontColor','<span style="border-bottom:3px solid #c22">A</span>','Font colour')+textbutton('BackColor','<span style="border-bottom:4px solid #fff200">▰</span>','Highlight colour')+textbutton('Grow','A⁺','Increase font size')+textbutton('Shrink','A⁻','Decrease font size'))))+group('Paragraph',rows(row(button('DefaultBullet','bullets')+button('DefaultNumbering','number')+button('DecrementIndent','indent')+button('IncrementIndent','indent'))+row(button('LeftPara','left')+button('CenterPara','center')+button('RightPara','right')+button('JustifyPara','justify')+button('SpacePara1','spacing'))+row(textbutton('ControlCodes','¶','Show formatting marks')+button('ParagraphDialog','spacing','Paragraph…'))))+group('Styles',`<div class="gallery"><button class="style" data-command="@style" data-argument="Standard"><em>AaBbCc</em><small>Normal</small></button><button class="style heading" data-command="@style" data-argument="Heading 1"><em>AaBbCc</em><small>Heading 1</small></button><button class="style titleStyle" data-command="@style" data-argument="Title"><em>AaBbCc</em><small>Title</small></button></div>`+button('DesignerDialog','style','Styles',true))+group('Editing',rows(button('SearchDialog','search','Find / Replace')+button('SidebarDeck.NavigatorDeck','nav','Navigation')+button('SelectAll','copy','Select all')));
const panels={Home:home,Insert:group('Pages',button('InsertPagebreak','copy','Page break',true))+group('Tables',button('InsertTable','table','Table',true))+group('Illustrations',button('InsertGraphic','image','Picture',true))+group('Links',button('HyperlinkDialog','link','Link',true))+group('Header & Footer',rows(button('PageNumberWizard','copy','Page number')+button('InsertField','copy','Field'))),File:group('Document',button('Save','save','Save',true)+button('SaveAs','save','Save as',true)+button('Print','copy','Print',true))+group('Export',button('ExportDirectToPDF','pdf','Export PDF',true)),Draw:group('Drawing',button('InsertDraw','image','Drawing tools',true)+button('BasicShapes','image','Shapes',true)),Design:group('Document',button('DesignerDialog','style','Styles',true)+button('PageDialog','copy','Page style',true)+button('Watermark','image','Watermark',true)),Layout:group('Page setup',button('PageDialog','copy','Page setup',true)+button('FormatColumns','nav','Columns',true))+group('Paragraph',button('ParagraphDialog','spacing','Paragraph',true)),References:group('References',button('InsertFootnote','copy','Footnote',true)+button('InsertEndnote','copy','Endnote',true)+button('InsertIndexesEntry','nav','Index entry',true)),Mailings:group('Mail merge',button('MailMergeWizard','nav','Mail merge',true)+button('AddressBookSource','nav','Data sources',true))+group('Create',button('InsertEnvelope','copy','Envelopes',true)+button('InsertLabels','copy','Labels',true)),Help:group('Help',button('@shortcuts','nav','Keyboard shortcuts',true)+button('CommandPopup','search','All commands',true)),Review:group('Proofing',button('SpellingAndGrammarDialog','style','Spelling',true))+group('Changes',button('TrackChanges','copy','Track changes',true)+button('AcceptAllTrackedChanges','copy','Accept all',true))+group('Comments',button('InsertAnnotation','copy','New comment',true)),View:group('Display',button('Sidebar','nav','Sidebar',true)+button('Ruler','table','Ruler',true)+button('Zoom','search','Zoom',true))+group('Navigation',button('SidebarDeck.NavigatorDeck','nav','Navigation',true))};
window.OfficeRibbon={group,rows,row,button,textbutton,home};
document.querySelector('#panels').innerHTML=Object.entries(panels).map(([name,markup])=>`<div class="ribbon panel ${name==='Home'?'visible':''}" data-panel="${name}">${markup}</div>`).join('');
function send(command,argument=''){window.webkit.messageHandlers.writer.postMessage({command,argument});document.querySelector('#feedback').textContent='';}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('selected',t===tab));document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('visible',p.dataset.panel===tab.dataset.tab));return;}const b=e.target.closest('button[data-command]');if(b){send(b.dataset.command,b.dataset.argument||'');if(b.dataset.command==='@autosave')b.querySelector('.switch').classList.toggle('on');}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-command]'))send(e.target.dataset.command,e.target.value)});
window.updateDocument=({title,modified,saved,autosave})=>{document.querySelector('#name').textContent=title;document.querySelector('#status').textContent=!saved?' · Not saved':modified?' · Unsaved':' · Saved';document.querySelector('.switch').classList.toggle('on',autosave);};
</script></html>
